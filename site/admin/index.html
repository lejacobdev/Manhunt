<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- Everything here is same-origin except the API (fetch + WebSocket) and its Socket.IO client. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://api.lejacob.dev; connect-src 'self' https://api.lejacob.dev wss://api.lejacob.dev; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Hunting Game Admin</title>
<meta name="theme-color" content="#090B10">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/admin/manifest.json">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HG Admin">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div id="app"></div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer glass" hidden tabindex="-1" aria-label="Details"></aside>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="https://api.lejacob.dev/socket.io/socket.io.min.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
