# Apache reverse proxy for the Hunting Game backend, fronted by Cloudflare.
#
# Traffic path: client -> Cloudflare (public TLS, orange-cloud proxied) ->
# this server on 80/443 -> Apache -> 127.0.0.1:${BACKEND_PORT} (the backend
# container; see docker-compose.yml, which binds it to loopback only).
#
# The :443 block uses a Cloudflare Origin CA certificate rather than a
# Let's Encrypt one — Cloudflare issues these for free from the dashboard
# (SSL/TLS -> Origin Server -> Create Certificate), they're valid up to 15
# years, and they're only trusted by Cloudflare's edge, which is exactly
# what you want when Cloudflare is the only thing that should ever be
# talking to this box directly. Cloudflare's SSL/TLS mode must be set to
# "Full (strict)" for this to be enforced end-to-end.
#
# The <RequireAny> IP allowlist (deploy/apache/cloudflare-ips.conf) is the
# actual enforcement of "only Cloudflare talks to this box" — closes the
# direct-origin-IP bypass that a public IP + open 80/443 would otherwise
# allow, independent of whatever Cloudflare itself does.
#
# Requires: a2enmod proxy proxy_http proxy_wstunnel rewrite ssl headers authz_host
#
# Install:
#   cp deploy/apache/cloudflare-ips.conf /etc/apache2/cloudflare-ips.conf
#   cp deploy/apache/api.lejacob.eu.conf /etc/apache2/sites-available/api.lejacob.eu.conf
#   sed -i 's/\${BACKEND_PORT}/8420/g' /etc/apache2/sites-available/api.lejacob.eu.conf
#   a2ensite api.lejacob.eu && apache2ctl configtest && systemctl reload apache2
#
# Get the Origin CA cert/key from the Cloudflare dashboard first and place
# them at the paths referenced below — Apache will refuse to start/reload
# without them.

<VirtualHost *:80>
    ServerName api.lejacob.eu

    <Location "/">
        <RequireAny>
            Include /etc/apache2/cloudflare-ips.conf
            Require ip 127.0.0.1
        </RequireAny>
    </Location>

    # Cloudflare talks to the origin over HTTPS when SSL/TLS mode is
    # Full/Full (strict) — this block only exists as a plain-HTTP fallback
    # (and for local `curl http://127.0.0.1:${BACKEND_PORT}/health` checks
    # run from the box itself), so it redirects rather than proxying.
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/api_lejacob_error.log
    CustomLog ${APACHE_LOG_DIR}/api_lejacob_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName api.lejacob.eu

    <Location "/">
        <RequireAny>
            Include /etc/apache2/cloudflare-ips.conf
            Require ip 127.0.0.1
        </RequireAny>
    </Location>

    SSLEngine On
    SSLCertificateFile /etc/cloudflare/origin.pem
    SSLCertificateKeyFile /etc/cloudflare/origin.key
    SSLCertificateChainFile /etc/cloudflare/origin_ca_rsa_root.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 65

    # Socket.IO's WebSocket upgrade needs its own rule ahead of the plain
    # HTTP proxy below — mod_proxy_wstunnel handles the ws:// scheme;
    # without this, the client falls back to (much slower) long-polling,
    # or the upgrade just fails outright depending on Apache version.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:${BACKEND_PORT}/socket.io/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/socket.io/(.*) http://127.0.0.1:${BACKEND_PORT}/socket.io/$1 [P,L]

    ProxyPass / http://127.0.0.1:${BACKEND_PORT}/
    ProxyPassReverse / http://127.0.0.1:${BACKEND_PORT}/

    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/api_lejacob_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/api_lejacob_ssl_access.log combined
</VirtualHost>
