# Apache reverse proxy for the Hunting Game backend.
#
# The backend runs in Docker, bound to 127.0.0.1:${BACKEND_PORT} only (see
# docker-compose.yml) — this vhost is the only thing on the machine allowed
# to reach it, and the only thing exposed to the public internet on 80/443.
#
# Requires: a2enmod proxy proxy_http proxy_wstunnel rewrite ssl headers
#
# Install: copy to /etc/apache2/sites-available/api.lejacob.eu.conf, replace
# ${BACKEND_PORT} with your actual port (matches BACKEND_PORT in .env), then
# `a2ensite api.lejacob.eu` + `systemctl reload apache2`.
#
# The SSLCertificateFile/SSLCertificateKeyFile paths below assume certbot's
# default Let's Encrypt layout — obtain the certificate BEFORE enabling the
# :443 block (see README §2 "Deploying with Apache" for the bootstrap order;
# Apache will refuse to start/reload if these paths don't exist yet).

<VirtualHost *:80>
    ServerName api.lejacob.eu

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/api.lejacob.eu-error.log
    CustomLog ${APACHE_LOG_DIR}/api.lejacob.eu-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName api.lejacob.eu

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.lejacob.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.lejacob.eu/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 65

    # Socket.IO's WebSocket upgrade needs its own rule ahead of the plain
    # HTTP proxy — mod_proxy_wstunnel handles the ws:// scheme, the plain
    # ProxyPass below covers everything else (REST API + Socket.IO's
    # long-polling fallback).
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:${BACKEND_PORT}/socket.io/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/socket.io/(.*) http://127.0.0.1:${BACKEND_PORT}/socket.io/$1 [P,L]

    ProxyPass / http://127.0.0.1:${BACKEND_PORT}/
    ProxyPassReverse / http://127.0.0.1:${BACKEND_PORT}/

    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/api.lejacob.eu-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/api.lejacob.eu-ssl-access.log combined
</VirtualHost>
