# Apache vhost for the Hunting Game marketing site — lejacob.dev's bare/apex domain.
#
# This is deliberately its own DocumentRoot (/var/www/lejacob-dev), NOT the shared
# /var/www/html used by the old lejacob.eu personal-server domain and several of its
# subdomains — pointing this vhost at that shared root would have made publishing this
# site overwrite whatever those other, unrelated sites already serve from it.
#
# Uses the same Cloudflare Origin CA certificate as api.lejacob.dev.conf (issued with
# both `lejacob.dev` and `*.lejacob.dev` as SANs, so one cert already covers this vhost
# too) and the same Cloudflare IP allowlist, via Include, for one source of truth instead
# of a second copy-pasted IP list.
#
# Requires: a2enmod rewrite ssl headers authz_host
#
# Install:
#   mkdir -p /var/www/lejacob-dev
#   rsync -a --delete site/ /var/www/lejacob-dev/   (see deploy/publish-site.sh)
#   cp deploy/apache/lejacob.dev.conf /etc/apache2/sites-available/lejacob.dev.conf
#   a2ensite lejacob.dev && apache2ctl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName lejacob.dev
    ServerAlias www.lejacob.dev

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/lejacob_dev_error.log
    CustomLog ${APACHE_LOG_DIR}/lejacob_dev_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName lejacob.dev
    ServerAlias www.lejacob.dev
    DocumentRoot /var/www/lejacob-dev

    SSLEngine On
    SSLCertificateFile /etc/cloudflare/origindev.pem
    SSLCertificateKeyFile /etc/cloudflare/origindev.key
    SSLCertificateChainFile /etc/cloudflare/origin_ca_rsa_root.pem

    <Directory /var/www/lejacob-dev>
        AllowOverride All
        Require all granted
    </Directory>

    <Location "/">
        <RequireAny>
            Include /etc/apache2/cloudflare-ips.conf
            Require ip 127.0.0.1
        </RequireAny>
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/lejacob_dev_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/lejacob_dev_ssl_access.log combined
</VirtualHost>
