services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to loopback only — never reachable from outside this machine.
    # Apache (running on the host, not in Docker) terminates TLS on 80/443
    # and reverse-proxies api.lejacob.dev here. See deploy/apache/api.lejacob.dev.conf.
    ports:
      - "127.0.0.1:${BACKEND_PORT}:4000"
    volumes:
      # The sideloadable IPA + SideStore source.json, published here by
      # ios/xtool/{docker-build.sh,xtool-build.sh} and served by the backend's
      # '/dist' route. Bind-mounted rather than baked into the image: it's build
      # output that changes on every app build, and re-imaging the backend just to
      # publish a new IPA would be absurd. Read-only — the server only serves it.
      - ./backend/dist-static:/app/dist-static:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      # Effectively "logged in until manually logged out" — there's no
      # refresh-token flow, so a short-lived token would silently start
      # rejecting requests instead of prompting a clean re-login.
      JWT_EXPIRES_IN: 3650d
      PORT: 4000
      OVERPASS_API_URL: https://overpass-api.de/api/interpreter
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: production

volumes:
  postgres_data:
