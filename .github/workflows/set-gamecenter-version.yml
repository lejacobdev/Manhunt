name: Game Center on a version

# Ubuntu, App Store Connect API only. Switches Game Center on or off for the version being prepared
# and reads the flag back. Public repo, public logs: identifiers and states only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Store version string being prepared, e.g. 1.0.2"
        required: true
      position:
        description: "on or off"
        required: true
        type: choice
        options: ["on", "off"]

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set the flag
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
          VERSION: ${{ inputs.version }}
          POSITION: ${{ inputs.position }}
        run: |
          echo "$API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          export KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          node scripts/asc-set-gamecenter-version.mjs "$VERSION" "$POSITION"
