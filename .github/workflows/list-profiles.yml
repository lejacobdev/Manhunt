name: Inspect signing setup

# Diagnostic only, and deliberately on ubuntu: it asks the App Store Connect API what
# profiles exist and never touches Xcode, so it costs seconds rather than a macOS build.
on:
  workflow_dispatch:
    inputs:
      enable_app_groups_for:
        description: "Optional: a bundle identifier to switch the App Groups capability on for (does nothing if it is already on)"
        required: false
        default: ""

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List profiles and App ID capabilities
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
          ENABLE_APP_GROUPS_FOR: ${{ inputs.enable_app_groups_for }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$API_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          node -e '
          const crypto = require("crypto"), fs = require("fs");
          const keyId = process.env.KEY_ID, issuer = process.env.ISSUER_ID;
          const key = fs.readFileSync(process.env.HOME + "/private_keys/AuthKey_" + keyId + ".p8");
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const input = b64({ alg: "ES256", kid: keyId, typ: "JWT" }) + "." +
                        b64({ iss: issuer, iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
          const sig = crypto.sign("sha256", Buffer.from(input), { key, dsaEncoding: "ieee-p1363" });
          const jwt = input + "." + sig.toString("base64url");

          (async () => {
            const res = await fetch("https://api.appstoreconnect.apple.com/v1/profiles?limit=200&include=bundleId",
              { headers: { Authorization: "Bearer " + jwt } });
            console.log("status", res.status);
            const body = await res.json();
            if (!res.ok) { console.log(JSON.stringify(body, null, 2)); return; }
            const bundles = new Map((body.included || []).map((b) => [b.id, b.attributes.identifier]));
            console.log("total profiles:", (body.data || []).length);
            for (const p of body.data || []) {
              const bundle = bundles.get(p.relationships?.bundleId?.data?.id) || "(no bundle)";
              console.log([p.attributes.profileType, p.attributes.profileState, bundle, p.attributes.name].join("  |  "));
            }

            // The authoritative answer on whether Push is actually enabled for the App ID,
            // rather than trying to read a checkbox out of a screenshot.
            const ids = await (await fetch(
              "https://api.appstoreconnect.apple.com/v1/bundleIds?limit=200&include=bundleIdCapabilities",
              { headers: { Authorization: "Bearer " + jwt } })).json();
            for (const b of ids.data || []) {
              if (!String(b.attributes.identifier).startsWith("com.huntinggame.app")) continue;
              const capIds = (b.relationships?.bundleIdCapabilities?.data || []).map((c) => c.id);
              const caps = (ids.included || [])
                .filter((i) => i.type === "bundleIdCapabilities" && capIds.includes(i.id))
                .map((i) => i.attributes.capabilityType);
              console.log("\nBUNDLE " + b.attributes.identifier);
              console.log("  capabilities: " + (caps.length ? caps.join(", ") : "(none)"));

              // Optional, explicit, additive: switch App Groups on for one bundle ID. This is what
              // Xcode's automatic signing does itself when it sees the entitlement; it needs doing
              // by hand only when the App ID never picked it up. Which groups the App ID may use is
              // decided later, when Xcode generates its profile from the entitlements file.
              if (process.env.ENABLE_APP_GROUPS_FOR && b.attributes.identifier === process.env.ENABLE_APP_GROUPS_FOR) {
                if (caps.includes("APP_GROUPS")) {
                  console.log("  -> App Groups already enabled, nothing to do");
                } else {
                  const made = await fetch("https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities", {
                    method: "POST",
                    headers: { Authorization: "Bearer " + jwt, "Content-Type": "application/json" },
                    body: JSON.stringify({ data: {
                      type: "bundleIdCapabilities",
                      attributes: { capabilityType: "APP_GROUPS" },
                      relationships: { bundleId: { data: { type: "bundleIds", id: b.id } } },
                    } }),
                  });
                  console.log("  -> enabling App Groups: HTTP " + made.status);
                  if (!made.ok) console.log(JSON.stringify(await made.json(), null, 2));
                }
              }
            }
          })();
          '
