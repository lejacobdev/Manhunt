name: iPhone screens

# Manual only. Unsigned and secret-free: builds the iPhone app for the simulator and screenshots
# every scenario in ScreenshotScenario.swift at the default text size, at the largest accessibility
# text size the match HUD supports, and with Increase Contrast — so accessibility changes are
# checked on real renders rather than assumed. There is no Mac in this setup; this is how the
# iPhone UI gets looked at.
#
#   gh workflow run iphone-screens.yml --ref <branch>
on:
  workflow_dispatch:

concurrency:
  group: iphone-screens
  cancel-in-progress: true

jobs:
  screens:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        working-directory: ios/HuntingGame
        run: |
          echo "DEVELOPMENT_TEAM = " > Config.xcconfig
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          phones = [(r, d["name"], d["udid"]) for r, ds in data["devices"].items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")]
          phones.sort(reverse=True)
          pick = next((p for p in phones if "Pro" in p[1] and "Max" not in p[1]), phones[0])
          print(f"name={pick[1]}")
          print(f"udid={pick[2]}")
          PY

      - name: Build for the simulator
        working-directory: ios/HuntingGame
        run: |
          set -o pipefail
          xcodebuild build -project HuntingGame.xcodeproj -scheme HuntingGame -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"

      - name: Screenshot every scenario
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          shoot() {  # $1 = variant label
            for S in auth rules hud-hunter hud-runner summary; do
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BUNDLE" -UIScenario "$S" >/dev/null
              sleep 7
              xcrun simctl io "$UDID" screenshot "$OUT/${1}_${S}.png" || true
            done
          }
          xcrun simctl ui "$UDID" content_size large
          xcrun simctl ui "$UDID" increase_contrast disabled || true
          shoot default
          xcrun simctl ui "$UDID" content_size accessibility-extra-large
          shoot largest-text
          xcrun simctl ui "$UDID" content_size large
          xcrun simctl ui "$UDID" increase_contrast enabled || true
          shoot increase-contrast
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screens
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: warn
