name: Export Signing Certificate

# Manual only, same reasoning as testflight.yml: burns paid macOS runner minutes on a
# private repo. This is the fast path when all you want is the Apple Distribution
# certificate + private key as a downloadable .p12 — it stops right after that, skipping
# the archive packaging, IPA export, and TestFlight upload (by far the slowest parts of
# the full testflight.yml pipeline), since none of that is needed just to mint/renew the
# signing identity and pull a copy of it off the runner.
on:
  workflow_dispatch:

jobs:
  export-cert:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kept in sync with testflight.yml's own reasoning for pinning 26.6 specifically —
      # see that file if this ever needs to change.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Download iOS and watchOS platforms
        run: |
          xcrun simctl list >/dev/null 2>&1 || true
          for platform in iOS watchOS; do
            for attempt in 1 2 3 4 5; do
              sudo xcodebuild -downloadPlatform "$platform" && break
              echo "Attempt $attempt to download $platform failed, retrying in 15s..."
              sleep 15
            done
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write signing team config
        working-directory: ios/HuntingGame
        run: echo "DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}" > Config.xcconfig

      - name: Generate Xcode project
        working-directory: ios/HuntingGame
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$API_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      # `build`, not `archive` — signing resolution (which is all this workflow actually
      # wants) happens during any real build action, and a plain build skips archive's
      # extra packaging/dSYM/embed work for a product this run throws away anyway.
      # A fresh keychain with a password *we choose*, rather than guessing at the login
      # keychain's — there's no fixed, documented default for that on GitHub's hosted
      # macOS images (confirmed the hard way: "runner" isn't it, and it isn't publicly
      # documented as anything else either). Reusing P12_EXPORT_PASSWORD as this
      # keychain's own unlock password too, since both are internal-only automation
      # secrets with no reason to be different. Added to the search list (not replacing
      # it) and made default so -allowProvisioningUpdates puts the new identity here,
      # where we already know the password needed to unlock/export it later.
      - name: Create a temporary signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.P12_EXPORT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING=$(security list-keychains -d user | sed 's/[" ]//g')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          security default-keychain -d user -s "$KEYCHAIN"

      # -allowProvisioningUpdates is what makes xcodebuild create/renew the certificate
      # and provisioning profile via the API key, the same as testflight.yml.
      - name: Build (just enough to resolve signing)
        working-directory: ios/HuntingGame
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild build \
            -project HuntingGame.xcodeproj \
            -scheme HuntingGame \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # `runner` is GitHub's own documented fixed password for the login keychain on its
      # hosted macOS images (fresh every boot, not a secret) — unlocking it and granting
      # the security/codesign tools non-interactive ACL access to the private key up front
      # avoids the keychain-access permission dialog a freshly-created identity otherwise
      # prompts for, which nothing on an unattended runner can click (confirmed: the first
      # attempt at this in testflight.yml hung indefinitely instead of failing). The short
      # timeout-minutes is a backstop in case it ever hangs again anyway.
      - name: Export signing certificate as .p12
        timeout-minutes: 3
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.P12_EXPORT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security export -k "$KEYCHAIN" -t identities -f pkcs12 \
            -P "$KEYCHAIN_PASSWORD" \
            -o "$RUNNER_TEMP/HuntingGame-signing.p12"

      - name: Upload signing certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuntingGame-signing-p12
          path: ${{ runner.temp }}/HuntingGame-signing.p12
          retention-days: 7
