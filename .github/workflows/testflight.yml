name: TestFlight

# Manual only — every run burns paid macOS runner minutes (private repo) and consumes one
# App Store Connect build-number slot, so this shouldn't fire on every push. Trigger it from
# the Actions tab, or `gh workflow run testflight.yml`.
on:
  workflow_dispatch:
    inputs:
      whats_new:
        description: "What to test (shown to testers in TestFlight)"
        required: false
        default: "Bug fixes and improvements."

# A second run queued while one is uploading would race for the same build number — this
# cancels the older one instead of letting them collide.
concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  build-and-upload:
    # macos-26, not macos-15: this image's default Xcode (26.6, pinned below) already
    # ships with the matching iOS/watchOS platform SDKs baked in. A non-default Xcode on
    # either image — 26.3 was tried on both — needs those platforms downloaded fresh on
    # every single run, and it's a genuine multi-GB simulator-runtime fetch, not a quick
    # check. Kept the download step anyway as a defensive fallback in case a future image
    # update ever drops the pre-cache; it should just no-op here.
    runs-on: macos-26
    timeout-minutes: 45
    # Mapped to job-level env so the import step can branch on whether the certificate
    # secret has been set up yet — the `secrets` context isn't dependable in a step-level
    # `if`, but `env` is. Before the secret exists this simply skips and the old
    # mint-a-cert-per-run behaviour still gets a build out.
    env:
      SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pins a specific Xcode rather than trusting whatever macos-15 defaults to today —
      # GitHub reshuffles the preinstalled set periodically, and a silent Xcode bump is a
      # bad way to discover a build now behaves differently.
      # Apple now rejects any upload built with less than the iOS 26 SDK (Xcode 26+) —
      # this used to be 16.2, which archived fine but was refused at upload time
      # ("must be built with the iOS 26 SDK"). Pinned to 26.6 specifically because it's
      # this runner image's *default* Xcode (see macos-26-Readme.md) — a non-default
      # version like 26.3 still needed its platform SDKs downloaded fresh on every run
      # (a genuine multi-GB simulator-runtime fetch, not a quick check), which is exactly
      # what pinning to the pre-baked default avoids.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      # Xcode 16 split each platform's SDK into a separately-downloadable component, and
      # this runner image's cached Xcode 16.2 install didn't have iOS or watchOS pulled in
      # (archiving failed with "iOS 18.2 is not installed"/"first download and install the
      # platform" before it built anything) — both are needed since the app embeds a watch
      # target. Anonymous, no Apple ID sign-in required for release-channel platforms.
      - name: Download iOS and watchOS platforms
        run: |
          # -downloadPlatform talks to CoreSimulatorService, which isn't warmed up yet on
          # a fresh runner ("Unable to connect to simulator") — one throwaway simctl call
          # starts it, and each download gets a few retries since the service can still
          # take a moment even after that.
          xcrun simctl list >/dev/null 2>&1 || true
          for platform in iOS watchOS; do
            for attempt in 1 2 3 4 5; do
              sudo xcodebuild -downloadPlatform "$platform" && break
              echo "Attempt $attempt to download $platform failed, retrying in 15s..."
              sleep 15
            done
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      # DEVELOPMENT_TEAM normally lives in a local, gitignored Config.xcconfig (see
      # Config.xcconfig.example) — CI has no such file checked out, so it's written fresh
      # from the repo secret every run instead.
      - name: Write signing team config
        working-directory: ios/HuntingGame
        run: echo "DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}" > Config.xcconfig

      - name: Generate Xcode project
        working-directory: ios/HuntingGame
        run: xcodegen generate

      # xcodebuild looks for App Store Connect API keys under ~/private_keys by name
      # (AuthKey_<KEYID>.p8) when a bare filename isn't enough context, but passing
      # -authenticationKeyPath explicitly below is what actually matters — this just puts
      # the decoded key somewhere that path can point to.
      - name: Write App Store Connect API key
        env:
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$API_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      # A fresh keychain with a password *we choose*, rather than guessing at the login
      # keychain's — there's no fixed, documented default for that on GitHub's hosted
      # macOS images (confirmed the hard way: "runner" isn't it, and it isn't publicly
      # documented as anything else either, despite that being a fairly common assumption
      # repeated in various CI writeups). Reusing P12_EXPORT_PASSWORD as this keychain's
      # own unlock password too, since both are internal-only automation secrets with no
      # reason to be different. Added to the search list (not replacing it) and made
      # default so the identity imported below lands somewhere xcodebuild will look.
      - name: Create a temporary signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.P12_EXPORT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING=$(security list-keychains -d user | sed 's/[" ]//g')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          security default-keychain -d user -s "$KEYCHAIN"

      # One stable signing identity from a repo secret, rather than letting
      # -allowProvisioningUpdates ask Apple for a brand-new certificate every run. That
      # minting is what quietly exhausted the account's certificate quota: every run starts
      # from an empty keychain, so Xcode found no usable identity and requested another one,
      # each time, until the account hit its ceiling and builds stopped dead.
      #
      # The .p12 behind this secret was assembled off-box — a CSR generated with openssl on
      # the project server, the .cer Apple issued against it, recombined into a .p12 — so no
      # Mac and no keychain export was involved. That matters because the export route this
      # replaces could never be made to work unattended: `security export` and
      # `set-key-partition-list` both block on a keychain-access dialog nothing can click,
      # which defeated three separate attempts (unlock login keychain, guess its password,
      # dedicated temp keychain) before this approach sidestepped the problem entirely.
      #
      # -T grants codesign and security non-interactive access to the private key at import
      # time; set-key-partition-list is what makes that grant stick on current macOS.
      # Importing needs both — with only one, signing later raises the same unanswerable
      # prompt. Deliberately NOT continue-on-error: if this breaks, the fallback would be
      # silently minting another certificate and refilling the quota, which is precisely the
      # failure this exists to prevent. Better to fail loudly and fix it.
      - name: Import signing certificate
        if: env.SIGNING_CERTIFICATE_P12 != ''
        timeout-minutes: 2
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.P12_EXPORT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/import.p12"
          security import "$RUNNER_TEMP/import.p12" -k "$KEYCHAIN" -P "$KEYCHAIN_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/import.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # -allowProvisioningUpdates lets xcodebuild create/renew whatever Identifiers,
      # certificates, and profiles the 4 targets (app, widgets, watch app, watch widgets)
      # need via the API key, instead of registering each one by hand in the portal first —
      # the key's role needs to be Admin (or App Manager, on recent App Store Connect) for
      # that to actually be allowed to create new ones rather than only use existing ones.
      #
      # CURRENT_PROJECT_VERSION is overridden to the run number (see project.yml, which
      # references it as $(CURRENT_PROJECT_VERSION) rather than a literal) because App
      # Store Connect refuses to accept the same version+build pair twice.
      - name: Archive
        working-directory: ios/HuntingGame
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project HuntingGame.xcodeproj \
            -scheme HuntingGame \
            -configuration Release \
            -archivePath build/HuntingGame.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # `destination: upload` makes -exportArchive push straight to App Store Connect as
      # part of the export step — no separate altool/notarytool/Transporter call needed.
      - name: Write export options
        working-directory: ios/HuntingGame
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST

      - name: Export & upload to TestFlight
        working-directory: ios/HuntingGame
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/HuntingGame.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # What the *exported* app is actually signed with, which is the only thing that
      # matters and is not what the archive shows: the archive carries a development
      # profile, and -exportArchive re-signs it for the App Store afterwards. Reading the
      # archive instead sent an earlier push investigation down a dead end. Never fails the
      # build — it exists to answer questions, not to gate anything.
      - name: Report exported signing
        if: always()
        continue-on-error: true
        working-directory: ios/HuntingGame
        run: |
          echo "--- export dir ---"
          ls -la build/export || true
          IPA=$(find build/export -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA written locally (destination: upload streams it straight to Apple)."
            exit 0
          fi
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa && unzip -q "$IPA" -d /tmp/ipa
          APP=$(find /tmp/ipa/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "--- entitlements actually signed into the exported app ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null || true
          echo "--- embedded profile ---"
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null \
            | plutil -extract Name raw - 2>/dev/null || true

      # The .xcarchive (dSYMs included) is the one artifact worth keeping past this run —
      # useful for symbolicating a crash report TestFlight shows later. The exported IPA
      # itself already made it to App Store Connect by this point, so it isn't uploaded here.
      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HuntingGame-xcarchive
          path: ios/HuntingGame/build/HuntingGame.xcarchive
          retention-days: 14
