name: HuntingGame
options:
  bundleIdPrefix: com.huntinggame.app
  deploymentTarget:
    iOS: "16.2" # ActivityKit's ActivityContent-based request/update API requires 16.2+
  createIntermediateGroups: true

# DEVELOPMENT_TEAM lives in Config.xcconfig (gitignored, not this repo) so
# your team selection survives `xcodegen generate` regenerating the whole
# .xcodeproj — copy Config.xcconfig.example to Config.xcconfig and fill in
# your Team ID once; see README "Signing for a device run".
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Automatic signing is the default for every target so a normal Xcode
    # device run/install just works once you pick a team in Signing &
    # Capabilities — do NOT force this to Manual/disabled here. The CLI
    # unsigned-archive path (build_ipa.sh) doesn't need it disabled at the
    # project level either: it passes CODE_SIGNING_ALLOWED=NO directly to
    # `xcodebuild archive`, which overrides whatever's baked into the
    # project regardless. Disabling it here previously meant every
    # `xcodegen generate` silently wiped out whatever signing config you'd
    # set by hand in Xcode, producing an unsigned .app that installd
    # rejects with "No code signature found."
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    # Every target's Info.plist below references these via $(...) instead of a literal,
    # so a CI upload can override just the build setting (see .github/workflows/
    # testflight.yml) rather than editing this file before every release. App Store
    # Connect rejects re-uploading the same version+build pair, so the workflow passes
    # a fresh CURRENT_PROJECT_VERSION (the run number) on every build.
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1

targets:
  HuntingGame:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Sources
      - path: Shared
      - path: LiveActivityShared
      # Was under `resources:` instead — every other target here lists its own folder
      # under `sources:` and gets its .xcassets auto-detected and compiled into
      # Assets.car that way; `resources:` for this one specific folder silently never
      # made it into a Copy/Compile build phase at all. Confirmed by inspecting an actual
      # archived .xcarchive: the watch app's Assets.car (under `sources:`) was there, the
      # main app's simply wasn't, which is why every icon size in it kept validating as
      # "missing" no matter how the icon set itself was structured.
      - path: Resources
    dependencies:
      - package: SocketIO
      - target: HuntingGameWidgets
        embed: true
      - target: HuntingGameWatch
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Hunting Game
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The app only makes standard HTTPS/WSS calls (URLSession, Socket.IO) to its own
        # backend — no custom or proprietary cryptography of its own — so this is exempt.
        # Declaring it here answers App Store Connect's "Missing Compliance" export
        # question automatically on every future TestFlight/App Store upload, instead of
        # it blocking each build from testing until answered by hand in the web UI.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationAlwaysAndWhenInUseUsageDescription: "Hunting Game tracks your position continuously during a match so hunters and runners can see live radar, compass bearings, and catch verification even while the app is backgrounded."
        NSLocationWhenInUseUsageDescription: "Hunting Game needs your location to place you on the live match map."
        NSMotionUsageDescription: "Hunting Game uses motion data to distinguish on-foot movement from vehicle travel for anti-cheat checks."
        NSCameraUsageDescription: "Hunting Game uses the camera to scan a friend's QR code so you can add them."
        # Mirrors ios/xtool/Info.plist — see the comment there for why friend QR codes go
        # through an https redirect into this custom scheme instead of a Universal Link.
        CFBundleURLTypes:
          - CFBundleURLName: com.huntinggame.app.friendlink
            CFBundleURLSchemes:
              - huntinggame
        UIBackgroundModes:
          - location
          - fetch
          - remote-notification
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
      entitlements:
        path: HuntingGame.entitlements
        properties:
          # com.apple.developer.location.push deliberately absent: it was declared false,
          # which does nothing, and Xcode still tries to resolve it against the profile and
          # fails the build outright once the entitlements file is actually applied.
          com.apple.security.application-groups:
            - group.com.huntinggame.app.widget
          # Declared as "development" here for the unsigned xtool/SideStore path (which
          # re-signs on-device against whatever personal/paid team is configured in
          # AltStore/SideStore) — Xcode overwrites this to "production" automatically when
          # archiving against an App Store distribution profile (see the TestFlight
          # workflow), so one declaration covers both build paths.
          aps-environment: development
          # Game Center. Also needs the GAME_CENTER capability on the App ID
          # (com.huntinggame.app) in App Store Connect, which scripts/gamecenter-setup.mjs
          # switches on. Without either half the app still runs: authentication just reports
          # failure and the Game Center card shows "offline".
          com.apple.developer.game-center: true
    settings:
      base:
        # Set explicitly rather than relying on the `entitlements:` block above to wire it
        # up. It doesn't: -showBuildSettings showed CODE_SIGN_ENTITLEMENTS unset entirely,
        # so the file was generated and then never applied. Everything in it was silently
        # absent from the signed app — no aps-environment (push registration failed with
        # "no valid aps-environment entitlement string found") and no application-groups
        # either, which the widget needs to read game state.
        CODE_SIGN_ENTITLEMENTS: HuntingGame.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.huntinggame.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Every screen in this app is a fixed-portrait, bottom-docked HUD layout (see
        # LobbyView/GameView) — never built or tested for landscape. Restricting to
        # iPhone-only here (overriding the project-wide "1,2") is what actually fits,
        # rather than declaring all four iPad-multitasking orientations for a UI that
        # was never designed to support them.
        TARGETED_DEVICE_FAMILY: "1"

  HuntingGameWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Widgets/HuntingGameWidgets
      - path: Shared
      - path: LiveActivityShared
    info:
      path: Widgets/HuntingGameWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hunting Game Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HuntingGameWidgets/HuntingGameWidgets.entitlements
      # `properties` is not optional in practice: an `entitlements:` block with only a `path`
      # makes XcodeGen OVERWRITE that file with an empty plist on every generate (181 bytes in CI,
      # measured), silently discarding whatever was checked in. This widget extension, the Watch
      # app and the complication therefore never shipped with their App Group — the home widget
      # and the watch face could not read the game state the app writes for them. Declared here so
      # the generated file is the real one.
      properties:
        com.apple.security.application-groups:
          - group.com.huntinggame.app.widget
        # Game Center. Only the iPhone app calls GameKit, but App Store Connect refused to add 1.0.2 for
        # review ("you must add the com.apple.developer.game-center key in Xcode") while its own record of
        # the build showed the key on the main binary only. Developers report that key missing from the
        # Watch and extension bundles as a cause of that message, so every embedded bundle carries it.
        # It needs the GAME_CENTER capability on the bundle's App ID too (list-profiles.yml,
        # enable_game_center_for), or archiving fails on a profile that lacks it.
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huntinggame.app.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Hunting Game Widgets
        SKIP_INSTALL: YES
        # Same trap the main app fell into: the `entitlements:` block above does not set
        # CODE_SIGN_ENTITLEMENTS, so it has to be set here. (Its `properties` matter too: see there.)
        CODE_SIGN_ENTITLEMENTS: Widgets/HuntingGameWidgets/HuntingGameWidgets.entitlements

  HuntingGameWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/HuntingGameWatch
      - path: Shared
    dependencies:
      - target: HuntingGameWatchWidgets
        embed: true
    info:
      path: Watch/HuntingGameWatch/Info.plist
      properties:
        CFBundleDisplayName: Hunting Game
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.huntinggame.app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Watch/HuntingGameWatch/HuntingGameWatch.entitlements
      # See HuntingGameWidgets above: without `properties` the file is generated empty.
      properties:
        com.apple.security.application-groups:
          - group.com.huntinggame.app.watch
        # Game Center on every embedded bundle: see HuntingGameWidgets above.
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huntinggame.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        # Same missing-entitlements trap as the main app (see HuntingGame's settings).
        CODE_SIGN_ENTITLEMENTS: Watch/HuntingGameWatch/HuntingGameWatch.entitlements
        # Apple App Review, Guideline 2.3 (submission fdcbff62, Sep 16 2026): "the
        # UIRequiredDeviceCapabilities key in the Info.plist is set up in such a way that the
        # app will not install on the device used in review" — an Apple Watch. Root cause:
        # this target never overrode the project-wide base TARGETED_DEVICE_FAMILY of "1,2"
        # (iPhone/iPad family codes), so a watchOS binary was shipping with an iOS device
        # family baked into its compiled Info.plist instead of watchOS's own family code
        # "4" — which is exactly what an install-eligibility check on a real Watch rejects.
        # Only the main HuntingGame app target overrode it (to "1"); these two watchOS
        # targets didn't, and silently inherited the wrong value.
        TARGETED_DEVICE_FAMILY: "4"

  HuntingGameWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidgets/HuntingGameWatchWidgets
      - path: Shared
    info:
      path: WatchWidgets/HuntingGameWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hunting Game Radar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/HuntingGameWatchWidgets/HuntingGameWatchWidgets.entitlements
      # Same App Group as the Watch app: the complication can only read game state through it.
      # This needs the group associated with the App ID (com.huntinggame.app.watchkitapp.widgets)
      # in the Apple Developer portal — Xcode cannot do that with an API key, and archiving fails
      # with "Authentication failed ... bearer token" / "No profiles for ... were found" without it.
      properties:
        com.apple.security.application-groups:
          - group.com.huntinggame.app.watch
        # Game Center on every embedded bundle: see HuntingGameWidgets above.
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huntinggame.app.watchkitapp.widgets
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/HuntingGameWatchWidgets/HuntingGameWatchWidgets.entitlements
        # Same fix as HuntingGameWatch above, and for the same reason — this extension is
        # embedded in the watchOS app, not the iOS one, so it needs watchOS's family code
        # too rather than the inherited iPhone/iPad "1,2".
        TARGETED_DEVICE_FAMILY: "4"
