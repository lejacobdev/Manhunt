name: HuntingGame
options:
  bundleIdPrefix: com.huntinggame.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1

targets:
  HuntingGame:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: Resources
    dependencies:
      - package: SocketIO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Hunting Game
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationAlwaysAndWhenInUseUsageDescription: "Hunting Game tracks your position continuously during a match so hunters and runners can see live radar, compass bearings, and catch verification even while the app is backgrounded."
        NSLocationWhenInUseUsageDescription: "Hunting Game needs your location to place you on the live match map."
        NSMotionUsageDescription: "Hunting Game uses motion data to distinguish on-foot movement from vehicle travel for anti-cheat checks."
        UIBackgroundModes:
          - location
          - fetch
          - remote-notification
      entitlements:
        path: HuntingGame.entitlements
        properties:
          com.apple.developer.location.push: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huntinggame.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
